{% extends 'tienda/base.html' %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white fw-bold text-center">Iniciar Sesión - Calzados Import</div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre de Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Ingresar al Sistema</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
